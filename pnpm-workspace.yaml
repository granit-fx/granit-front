packages:
  - 'packages/@granit/*'

# Migrated from the package.json "pnpm" block: pnpm 11 no longer reads that field.
# Overrides pin transitive versions — several are security floors; keep in sync with
# the resolved versions in pnpm-lock.yaml.
overrides:
  '@opentelemetry/core': '>=2.8.0'
  '@tanstack/query-core': '^5.100.11'
  '@tanstack/react-query': '^5.0.0'
  axios: '^1.18.1'
  dompurify: '>=3.4.12'
  esbuild: '>=0.28.1'
  js-cookie: '>=3.0.7'
  js-yaml: '^4.2.0'
  markdown-it: '>=14.2.0'
  msw: '^2.15.0'
  picomatch: '>=4.0.4'
  protobufjs: '>=8'
  react: '^19.0.0'
  react-dom: '^19.0.0'
  uuid: '^11.1.1'

# pnpm 11 replaces onlyBuiltDependencies with the allowBuilds map: only these
# dependencies may run install/build lifecycle scripts (native binaries).
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  esbuild: true
  msw: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@tanstack/react-virtual@3.14.6'
  - '@tanstack/virtual-core@3.17.4'
