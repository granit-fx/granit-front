# =============================================================================
# SonarQube — Project configuration
# =============================================================================
# Static properties are defined here. Dynamic properties (host URL, token)
# remain as CLI arguments in the GitHub Actions workflow.
# =============================================================================

# Key and name are provided via -Dsonar.projectKey and -Dsonar.projectName
# in the CI workflow

# Source directories (monorepo structure)
sonar.sources=packages

# Coverage reports (LCOV format from Vitest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Analysis exclusions — not analyzed at all
sonar.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.d.ts

# Test file inclusions — analyzed as test code (suppresses production-code rules:
# security hotspots, duplication, credential detection, etc.)
sonar.test.inclusions=\
  **/src/testing/**

# Wait for quality gate result before finishing the CI job
sonar.qualitygate.wait=true
