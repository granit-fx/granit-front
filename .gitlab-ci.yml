# =============================================================================
# GitLab CI/CD - Granit Front
# =============================================================================
# Pipeline : quality -> gitlab-security -> test -> analysis
#
# Variables requises (Settings > CI/CD > Variables) :
#   Aucune — les packages sont consommés via link: en local
#
# Variables optionnelles :
#   SONAR_HOST_URL  : URL du serveur SonarQube (ex: https://sonar.digitaldynamics.be)
#   SONAR_TOKEN     : Token d'authentification SonarQube (masked)
# =============================================================================

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

variables:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  HUSKY: '0'

stages:
  - quality
  - gitlab-security
  - test
  - analysis

# ---------------------------------------------------------------------------
# HIDDEN JOBS
# ---------------------------------------------------------------------------

.node_base:
  image: node:24-bookworm-slim
  tags:
    - docker
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/

# ---------------------------------------------------------------------------
# QUALITY
# ---------------------------------------------------------------------------

lint:
  stage: quality
  extends: .node_base
  script:
    - pnpm lint

typecheck:
  stage: quality
  extends: .node_base
  script:
    - pnpm tsc

# ---------------------------------------------------------------------------
# SECURITY
# ---------------------------------------------------------------------------

secret_detection:
  stage: gitlab-security
  before_script: []
  allow_failure: false

sast:
  stage: gitlab-security
  before_script: []

semgrep-sast:
  stage: gitlab-security
  before_script: []
  allow_failure: false

# ---------------------------------------------------------------------------
# TEST
# ---------------------------------------------------------------------------

test:
  stage: test
  extends: .node_base
  script:
    - pnpm test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week

# ---------------------------------------------------------------------------
# ANALYSIS
# ---------------------------------------------------------------------------

audit:npm:
  stage: analysis
  extends: .node_base
  script:
    - pnpm audit --audit-level moderate 2>&1 | tee audit-report.txt
    - '! grep -qE "^[0-9]+ (moderate|high|critical)" audit-report.txt'
  artifacts:
    when: always
    paths:
      - audit-report.txt
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == 'develop'
    - if: $CI_COMMIT_BRANCH == 'main'
  allow_failure: true

sonarqube:
  stage: analysis
  image:
    name: sonarsource/sonar-scanner-cli
    entrypoint: ['']
  variables:
    SONAR_PROJECT_KEY: 'granit-front'
    SONAR_USER_HOME: '${CI_PROJECT_DIR}/.sonar'
    GIT_DEPTH: '0'
  script:
    - sonar-scanner
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.sources=packages
      -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
      -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.d.ts
      -Dsonar.qualitygate.wait=true
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $SONAR_HOST_URL && $SONAR_TOKEN
    - if: $CI_COMMIT_BRANCH == 'develop' && $SONAR_HOST_URL && $SONAR_TOKEN
    - if: $CI_COMMIT_BRANCH == 'main' && $SONAR_HOST_URL && $SONAR_TOKEN
