version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    ignore:
      # Singleton peer dependencies. The framework advertises a deliberately wide
      # compatible range (react ^19.0.0, @tanstack/react-query ^5.0.0, …) and the
      # `dep-uniformity` gate requires ONE identical constraint across 237
      # manifests. Dependabot rewrites only the subset of manifests whose range
      # does not already satisfy the new version, so a routine patch bump splits
      # the workspace in two — pnpm then resolves two physical copies of React and
      # every hook reads as null under Vitest. Bump these deliberately, workspace
      # wide, with `pnpm dedupe` afterwards. Majors still raise a PR for review.
      - dependency-name: 'react'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@tanstack/react-query'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-i18next'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-hook-form'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      # TypeScript 7 (the native Go port) is not adoptable yet, on two counts:
      #   1. typescript-eslint declares `typescript: >=4.8.4 <6.1.0` and hard-throws
      #      "does not support TS 7.0" at load — `pnpm lint` dies with exit 2.
      #      Support is tracked for TS >= 7.1 in typescript-eslint#10940.
      #   2. TS 7 drops the compiler API from the package entry point
      #      (`exports["."]` -> ./lib/version.cjs); the full AST surface only lives
      #      under the explicitly unstable `typescript/unstable/*` subpaths, which
      #      @granit/contract-tests consumes via `import * as ts from 'typescript'`.
      # Revisit once typescript-eslint ships TS 7.1 support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # TanStack Table majors are rewrites, not bumps. v9 renamed the hook
      # (`useReactTable` -> `useTable`), turned row models into feature slots
      # (`getCoreRowModel()` is gone, the core model is implicit) and added a
      # leading `TFeatures` generic to every core type — so `ColumnDef<T, V>`
      # became `ColumnDef<TFeatures, T, V>`. That reaches ~65 call sites across
      # 29 packages and changes the column-definition types 28 of them expose to
      # showcase-admin-react, which makes it a coordinated breaking change rather
      # than something to merge from a dependabot PR. The framework pins one
      # feature set in `@granit/react-ui-kit` (`dataTableFeatures`); see
      # MIGRATION.md. Minors and patches are excluded for the singleton-peer
      # reason above: the range is declared in both `peerDependencies` and
      # `devDependencies` of 28 published packages, so a patch bump rewrites the
      # peer floor showcase-admin-react resolves against — a contract change for
      # no functional gain, since the resolved version already moves through the
      # lockfile. Bump it workspace wide, like every other singleton peer.
      - dependency-name: '@tanstack/react-table'
        update-types:
          [
            'version-update:semver-major',
            'version-update:semver-minor',
            'version-update:semver-patch',
          ]
      # Every remaining third-party `peerDependencies` entry, for the same
      # reason: the declared range IS the published contract showcase-admin-react
      # resolves against, so a routine minor or patch narrows it in every
      # manifest that advertises it (lucide-react 59, react-router 40, msw 63)
      # while the resolved version already moves through the lockfile alone.
      # `@puckeditor/core` is on 0.x, where a minor is a semver major: 0.23.0
      # sits outside the `^0.22.x` peer range of react-blog, react-cms and
      # react-ui-blog. Majors still raise a PR for review.
      - dependency-name: 'lucide-react'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'react-router'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'msw'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'i18next'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@tiptap/*'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@puckeditor/core'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'next-themes'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'class-variance-authority'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'date-fns'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: '@date-fns/tz'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
      - dependency-name: 'axios'
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']
    groups:
      granit:
        patterns:
          - '@granit/*'
      tanstack:
        patterns:
          - '@tanstack/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
          - 'msw'
      linting:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'markdownlint-cli2'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      i18n:
        patterns:
          - 'i18next'
          - 'react-i18next'
          - 'i18next-*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'react-hook-form'
          - 'react-router'
      # Singleton libraries the `dep-uniformity` gate requires to stay on one
      # constraint workspace-wide. Grouping keeps a bump atomic and reviewable as
      # one unit (React/i18n singletons already travel via the react/i18n groups).
      shared-runtime:
        patterns:
          - 'date-fns'
          - 'zod'
          - 'clsx'
          - 'tailwind-merge'
      build:
        patterns:
          - 'tsup'
          - 'typescript'
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
        exclude-patterns:
          - '@granit/*'
          - '@tanstack/*'
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
          - 'msw'
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'markdownlint-cli2'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'i18next'
          - 'react-i18next'
          - 'i18next-*'
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'react-hook-form'
          - 'react-router'
          - 'date-fns'
          - 'zod'
          - 'clsx'
          - 'tailwind-merge'
          - 'tsup'
          - 'typescript'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
